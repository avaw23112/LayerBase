name: MainScope Refactor

on:
  push:
    branches:
      - feat/main-scope-default-runtime
    paths:
      - tools/apply_main_scope_refactor.py
      - .github/workflows/main-scope-refactor.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/main-scope-default-runtime
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Apply Scope-first refactor
        run: python3 tools/apply_main_scope_refactor.py

      - name: Restore dependencies
        run: dotnet restore

      - name: Build release
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Remove one-shot automation
        run: |
          rm tools/apply_main_scope_refactor.py
          rm .github/workflows/main-scope-refactor.yml

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make MainScope own runtime business resources"
          git push origin HEAD:feat/main-scope-default-runtime
