name: CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Library compatibility (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version:
          - "8.0.x"
          - "9.0.x"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore runtime projects
        run: |
          dotnet restore LayerBase.Task/LayerBase.Task.csproj
          dotnet restore LayerBase.Generator/LayerBase.Generator/LayerBase.Generator.csproj
          dotnet restore LayerBase/LayerBase.csproj

      - name: Build runtime projects
        run: |
          dotnet build LayerBase.Task/LayerBase.Task.csproj \
            --configuration Release \
            --no-restore
          dotnet build LayerBase.Generator/LayerBase.Generator/LayerBase.Generator.csproj \
            --configuration Release \
            --no-restore
          dotnet build LayerBase/LayerBase.csproj \
            --configuration Release \
            --no-restore

  test:
    name: Full build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore LayerBase.sln

      - name: Build
        run: |
          dotnet build LayerBase.sln \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test LayerBase.Test/LayerBase.Test.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"

  package-smoke:
    name: Package consumer smoke test
    runs-on: ubuntu-latest
    needs:
      - compatibility
      - test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Pack and consume packages
        shell: pwsh
        run: ./eng/verify-package-smoke.ps1 -Configuration Release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/package-smoke/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - package-smoke
    permissions:
      contents: read

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs

      - name: Push NuGet packages
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
